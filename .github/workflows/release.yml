    uses: telekom-mms/.github/.github/workflows/release.yml@ac2257e2da733bb1a3c1da5c9b7b2b4cf88c5c3c # main
    secrets:
      GH_BRANCH_PROTECTION_APP_TOKEN: ${{ secrets.GH_BRANCH_PROTECTION_APP_TOKEN }}
