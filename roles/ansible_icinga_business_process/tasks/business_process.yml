---

- name: Check if business process already exists
  ansible.builtin.uri:
    url: "{{ icinga_business_process_url }}/businessprocess/process/show?config={{ item.title }}&format=json"
    user: "{{ icinga_business_process_user }}"
    password: "{{ icinga_business_process_password }}"
    force_basic_auth: "{{ icinga_business_process_force_basic_auth | default(omit) }}"
    method: GET
    status_code:
      - 404
      - 200
  register: ansible_icinga_business_process_already_exists

- name: Download configuration of existing business process
  when: ansible_icinga_business_process_already_exists.status == 200
  ansible.builtin.uri:
    url: "{{ icinga_business_process_url }}/businessprocess/process/download?config={{ item.title }}"
    user: "{{ icinga_business_process_user }}"
    password: "{{ icinga_business_process_password }}"
    force_basic_auth: "{{ icinga_business_process_force_basic_auth | default(omit) }}"
    method: GET
    return_content: true
  register: ansible_icinga_business_process_configuration_download

- name: Cleanup downloaded process configuration
  when:
    - ansible_icinga_business_process_already_exists.status == 200
    - ansible_icinga_business_process_configuration_download.content is defined
  ansible.builtin.set_fact:
    ansible_icinga_business_process_dl_cleanup: "{{ ansible_icinga_business_process_configuration_download.content | replace('\n\n\n', '\n') | replace('\n\n', '\n') }}"

- name: Cleanup business process configuration
  ansible.builtin.set_fact:
    ansible_icinga_business_process_template_cleanup: "{{ lookup('template', './config.j2', convert_data=False) | replace('\n\n', '\n') }}"

- name: Delete existing business process if it exists
  when:
    - ansible_icinga_business_process_already_exists.status == 200
    - ansible_icinga_business_process_dl_cleanup != ansible_icinga_business_process_template_cleanup
  ansible.builtin.uri:
    url: "{{ icinga_business_process_url }}/businessprocess/process/config?config={{ item.title }}"
    user: "{{ icinga_business_process_user }}"
    password: "{{ icinga_business_process_password }}"
    force_basic_auth: "{{ icinga_business_process_force_basic_auth | default(omit) }}"
    method: POST
    body_format: form-urlencoded
    body:
      __FORM_NAME: IcingaModuleBusinessprocessFormsBpConfigForm
      name: "{{ item.title }}"
      Title: "{{ item.title }}"
      Delete: Delete
    status_code:
      - 302

- name: Upload template
  when: >
    (
      ansible_icinga_business_process_already_exists.status == 200 and
      ansible_icinga_business_process_dl_cleanup != ansible_icinga_business_process_template_cleanup
    ) or
    ansible_icinga_business_process_already_exists.status == 404
  ansible.builtin.uri:
    url: "{{ icinga_business_process_url }}/businessprocess/process/upload"
    user: "{{ icinga_business_process_user }}"
    password: "{{ icinga_business_process_password }}"
    force_basic_auth: "{{ icinga_business_process_force_basic_auth | default(omit) }}"
    method: POST
    status_code:
      - 302
    body_format: form-urlencoded
    body:
      name: '{{ item.title }}'
      source: "{{ lookup('template', './config.j2', convert_data=False) }}"
      Store: Store
      __FORM_NAME: IcingaModuleBusinessprocessFormsBpUploadForm
  register: ansible_icinga_business_process_upload
  retries: 10
  delay: 10
  until: ansible_icinga_business_process_upload.status == 302
