---

- name: Perform general configuration checks
  ansible.builtin.include_tasks: configuration_checks_general.yml

- name: Perform business process configuration checks
  ansible.builtin.include_tasks: configuration_checks_business_process.yml
  loop: "{{ icinga_business_processes }}"
  loop_control:
    loop_var: businessprocess

- name: Setup business processes
  ansible.builtin.include_tasks: business_process.yml
  loop: "{{ icinga_business_processes }}"
